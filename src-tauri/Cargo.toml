[package]
name = "app"
version = "2.0.1"
description = "LemiCraft Launcher — Tauri + Vue launcher for lemicraft.ru"
authors = ["KOTOKOPOLb"]
license = "MIT"
repository = "https://github.com/LemiCraft/LemiCraft-Launcher"
homepage = "https://lemicraft.ru"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
portablemc = "5"
dirs = "6"
uuid = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "multipart", "form", "query"] }
tokio = { version = "1", features = ["full"] }
open = "5"
base64 = "0.23"
tauri-plugin-dialog = "2.7.3"
sysinfo = "0.39"
chrono = "0.4"
tauri-plugin-prevent-default = { version = "5.0.2", features = ["platform-windows"] }
hickory-resolver = { version = "0.26", features = ["tokio"] }
fs_extra = "1.3"
sha2 = "0.11"
zip = "8"
tauri-plugin-deep-link = "2"
fastnbt = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
