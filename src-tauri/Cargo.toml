[package]
name = "app"
version = "2.3.0"
description = "Официальный лаунчер LemiCraft"
authors = ["KOTOKOPOLb"]
license = "MIT"
repository = "https://github.com/LemiCraft/LemiCraft-Launcher"
homepage = "https://lemicraft.ru"
publish = false
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
portablemc = "5"
dirs = "7"
uuid = "1"
reqwest = { version = "0.13", features = ["blocking", "json", "multipart", "form", "query"] }
tokio = { version = "1", features = ["full"] }
open = "5"
base64 = "0.23"
tauri-plugin-dialog = "2.8.2"
sysinfo = "0.39"
chrono = "0.4"
hickory-resolver = { version = "0.26", features = ["tokio"] }
fs_extra = "1.3"
sha2 = "0.11"
zip = "9"
tauri-plugin-deep-link = "2.6.1"
fastnbt = "2"
discord-rich-presence = "1.1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.3", features = ["deep-link"] }

# Account tokens at rest off Windows (secret.rs) — Windows keeps using DPAPI
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-prevent-default = { version = "6.0.1" }
chacha20poly1305 = "0.11"
getrandom = "0.4"
# In-place self-update for the AppImage and macOS builds (Windows keeps its own installer flow in update.rs)
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { version = "6.0.1", features = ["platform-windows"] }
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
