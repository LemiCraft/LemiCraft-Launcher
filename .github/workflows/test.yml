# Unit tests and a full compile on every push to main and every pull request; Release runs it too before building anything.
# Publishes nothing and needs no secrets.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      # Each system compiles its own platform-specific code, which a Windows machine can't check
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file patchelf libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The Rust build reads the built frontend (frontendDist), so it must exist before cargo runs
      - run: npm run build
      # Tests that need the internet are marked #[ignore] and stay out of this run
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked
